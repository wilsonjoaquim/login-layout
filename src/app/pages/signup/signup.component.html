<app-default-login-layout
    title="Sign In and Start Today"
    primaryBtnText = "Signup Now"
    secondaryBtnText = "Login Now"
    (submit)="submit()"
    (navigate)="navigate()"
    [disablePrimaryBtn]="!signupForm.valid"
>
    <form [formGroup]="signupForm">
      <app-primary-input
        formControlName="name"
        inputName="name"
        type="text"
        label="Your Name"
        placeholder="Wilson Lopes"
        >
          <img src="/assets/svg/email-icon.svg"/>
        </app-primary-input>
        <app-primary-input
        formControlName="email"
        inputName="email"
        type="email"
        label="Email"
        placeholder="wilsonlopes@gmail.com"
        >
          <img src="/assets/svg/email-icon.svg"/>
        </app-primary-input>
        <app-primary-input
        formControlName="password"
        inputName="password"
        type="password"
        label="Your Password"
        >
          <img src="/assets/svg/pass-icon.svg"/>
        </app-primary-input>
        <app-primary-input
        formControlName="passwordConfirm"
        inputName="passwordConfirm"
        type="password"
        label="Confirm Your Password"
        >
          <img src="/assets/svg/pass-icon.svg"/>
        </app-primary-input>
    </form>
</app-default-login-layout>
